version: '3.8'
services:
  db:
    image: timescale/timescaledb-ha:pg14-latest
    environment:
      POSTGRES_USER: ${DB_USER:-nwisx_user}
      POSTGRES_PASSWORD: ${DB_PASS:-nwisx_pass}
      POSTGRES_DB: ${DB_NAME:-nwisx_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000

volumes:
  pgdata:
  redisdata:
